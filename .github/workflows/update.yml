name: 도시계획 뉴스 자동수집

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 3 * * *"
    - cron: "30 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: urban-planning-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 필요한 프로그램 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 뉴스와 정책자료 수집
        run: python scripts/collect.py
      - name: 수집 결과 확인
        run: |
          test -f data/latest.json
          test -f data/keywords.json
          test -f data/issues.json
      - name: 수집 결과 커밋
        run: |
          git config user.name "urban-planning-news-bot"
          git config user.email "urban-planning-news-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경사항 없음. 배포는 계속 진행."
          else
            git commit -m "자동수집"
            git push
          fi
      - name: 홈페이지 파일 준비
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/
          touch _site/.nojekyll
          cp data/latest.json data/keywords.json data/issues.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
